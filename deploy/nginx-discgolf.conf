# nginx: discgolf.sodamachine.net goes to the disc golf service instead of serving the folder from
# disk (see README, "The save service"). Replace the site's root/try_files lines with this location
# block and keep its existing listen/ssl/server_name lines.
#
# X-Forwarded-For must be set: the service only accepts the door's save requests when they come
# straight from this machine, and that header is how it tells a request that came through nginx.

location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
