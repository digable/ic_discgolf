<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="IC Disc Golf, web version: a 3-click swing meter disc golf game on real courses.">
<title>IC Disc Golf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd84d' stroke='%237a5a00' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%237a5a00' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="map" role="img" aria-label="The hole, seen from above"></canvas>

  <div class="top" id="top">
    <div class="chip"><b id="hCourse">IC Disc Golf</b><small>hole</small><span id="hHole">-</span></div>
    <div class="chip"><small>par</small><span id="hPar">-</span></div>
    <div class="chip"><small>pin</small><span id="hPin">-</span></div>
    <div class="grow"></div>
    <div class="chip"><small id="hThrowLabel">throw</small><span id="hThrow">1</span></div>
    <div class="chip"><small>round</small><span id="hRound">E</span></div>
    <!-- Buttons (outlined in blue) as against the information chips above. Each shows its key (hidden on phones). -->
    <button class="chip btn" id="reliefBtn" type="button" title="Optional relief: move back along the line from the basket (R)" hidden><span class="v">relief</span><kbd class="key" aria-hidden="true">R</kbd></button>
    <button class="chip btn" id="mullBtn" type="button" title="Mulligan: take that throw back and throw it again (M)" hidden><span class="v">mulligan</span><kbd class="key" aria-hidden="true">M</kbd></button>
    <div class="chip seg" id="viewSeg" role="group" aria-label="View (V switches)">
      <button type="button" data-view="map" aria-pressed="true">map</button><button type="button" data-view="pov" aria-pressed="false">lie</button><kbd class="key" aria-hidden="true">V</kbd>
    </div>
    <button class="chip btn" id="cardBtn" type="button" title="The scorecard, and quitting the round (C)" aria-haspopup="dialog" aria-expanded="false"><span class="v">card</span><kbd class="key" aria-hidden="true">C</kbd></button>
  </div>

  <div class="msg" id="msg" aria-live="polite"></div>

  <div class="panel" id="panel">
    <div class="card gapChip" id="gapChip" hidden></div>
    <div class="card discCard">
      <div class="disc"><button class="dot" id="discDot" type="button" aria-label="Next disc (D)"><kbd class="key" aria-hidden="true">D</kbd></button>
        <div class="dinfo"><div class="dname"><span id="dName">-</span> <span class="label" id="dWeight"></span></div>
          <div class="nums" id="dNums"></div><div class="label" id="dRange"></div></div></div>
      <div class="toggles">
        <button class="tg" id="tStyle" type="button"><span class="v">backhand</span><kbd class="key" aria-hidden="true">T</kbd></button>
        <button class="tg" id="tHand" type="button"><span class="v">right</span><kbd class="key" aria-hidden="true">H</kbd></button>
        <button class="tg" id="tAngle" type="button"><span class="v">flat</span><kbd class="key" aria-hidden="true">A</kbd></button>
      </div>
    </div>
    <div class="card windCard"><div class="arrow" id="wArrow" aria-hidden="true">↑</div><div><div class="label">wind</div><div class="dname" id="wText">calm</div></div></div>
    <div class="card meterCard">
      <div class="label" id="mLabel">Tap THROW (or press SPACE) to reach back</div>
      <div class="ticks" id="ticks"></div>
      <div class="bar" id="bar"><div class="over"></div><div class="snap" id="snap"></div><div class="p100" id="p100"></div>
        <div class="pin" id="pinMark" hidden><span id="pinFt"></span></div>
        <div class="press" id="pressP"></div><div class="mark" id="mark"></div></div>
      <button class="throw" id="throwBtn" type="button">THROW</button>
    </div>
  </div>

  <div class="sheet" id="menu" hidden>
    <div class="sheetIn menuIn" role="dialog" aria-labelledby="menuTitle">
      <h1 id="menuTitle">IC Disc Golf</h1>
      <p class="label">The same game as the <a href="../">terminal</a> and the BBS, drawn for the web. Your setup, bag and house rules are kept in this browser.</p>
      <div class="tabs" role="tablist" aria-label="Menu">
        <button type="button" role="tab" data-tab="play">Play</button><button type="button" role="tab" data-tab="setup">Setup</button><button type="button" role="tab" data-tab="bag">Bag</button><button type="button" role="tab" data-tab="house">House rules</button>
      </div>
      <div id="menuBody" role="tabpanel"></div>
    </div>
  </div>

  <div class="sheet" id="done" hidden><div class="sheetIn" id="doneIn" role="dialog" aria-label="Scorecard"></div></div>
</div>

<!-- The game itself: the same files the BBS door and the terminal version run -->
<script src="../bbs/lib/config.js"></script>
<script src="../bbs/lib/util.js"></script>
<script src="../bbs/lib/discs.js"></script>
<script src="../bbs/lib/courses.js"></script>
<script src="../bbs/lib/player.js"></script>
<script src="../bbs/lib/holes.js"></script>
<script src="../bbs/lib/state.js"></script>
<script src="../bbs/lib/flight.js"></script>
<script src="../bbs/lib/rules.js"></script>
<script src="../bbs/lib/meter.js"></script>
<script src="../bbs/lib/saves.js"></script>  <!-- only its checks for saved settings (applySettings, currentSettings) -->
<script src="../bbs/lib/pov.js"></script>    <!-- only its camera (POV) and the gap through the trees (povHits, gapInfo) -->
<script src="../bbs/lib/shot.js"></script>   <!-- only its result wording (scoreName, waterLine...) -->
<script src="../bbs/lib/putt.js"></script>   <!-- only its result wording (puttLine, puttWhy) -->
<script src="../bbs/lib/menus.js"></script>  <!-- only its forms and lists (SETUP, HOUSE_FORM, BAG_COLS, toggleBag, courseOrder...) -->
<script src="text.js"></script>
<script src="draw.js"></script>
<script src="pov.js"></script>
<script src="menu.js"></script>
<script src="game.js"></script>
</body>
</html>
